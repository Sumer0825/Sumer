<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Planet 612</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planet 612">
<meta name="theme-color" content="#1a1230">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f6fb;
    --primary: #4f7cff;
    --text: #1f2733;
    --muted: #8a94a6;
    --line: #e6eaf1;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  /* 根元素背景：按规范绘制覆盖整个屏幕画布（含 iOS 工具栏后方），各端必然铺满 */
  html, body { margin: 0; min-height: 100%; }
  html {
    background: linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.30)), url('assets/bg.jpg?v=2') center / cover no-repeat #f4f6fb;
  }
  body {
    font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
  }
  .topbar {
    height: 60px; display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 0 22px;
    padding-top: env(safe-area-inset-top); height: calc(60px + env(safe-area-inset-top));
  }
  .topbar .logo { font-size: 22px; }
  .topbar .title { font-size: 17px; font-weight: 700; }
  .topbar .crumb { margin-left: auto; font-size: 14px; color: var(--muted); }
  .topbar .crumb b { color: var(--primary); }
  .topbar .back {
    margin-left: auto; border: 1px solid var(--line); background: #fff; color: var(--text);
    padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; display: none;
  }
  .topbar .back:hover { border-color: var(--primary); color: var(--primary); }

  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 22px 40px; }

  /* 首页：按钮上下垂直排列，居中，自适应宽度 */
  .home { }
  .home h1 { font-size: 22px; margin: 4px 0 4px; text-align: center; color: #fff; text-shadow: 0 1px 8px rgba(60,35,10,.45); }
  .home .sub { color: rgba(255,255,255,.92); font-size: 14px; margin-bottom: 24px; text-align: center; text-shadow: 0 1px 6px rgba(60,35,10,.4); }
  .tools {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .tool-card {
    width: min(240px, 100%);                        /* 水平长度不变 */
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.55);                    /* 半透明卡片 */
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);   /* 毛玻璃 */
    border: 1px solid rgba(191,154,125,.92);             /* 手臂肤色 #bf9a7d */
    border-radius: 14px;
    padding: 11px 18px; cursor: pointer; transition: .15s; box-shadow: 0 1px 3px rgba(20,30,60,.05);
    position: relative; overflow: hidden; text-align: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .tool-card:hover { border-color: rgba(211,175,143,.98); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(191,154,125,.22); background: rgba(255,255,255,.7); }
  .tool-card:active { transform: scale(.96); }          /* 按压缩放 */
  .tool-card .txt { flex: 1; min-width: 0; }              /* 文字块占剩余空间，名称居中显示 */
  .tool-card .ico {
    width: 36px; height: 36px; flex: 0 0 36px; border-radius: 10px; background: rgba(238,243,255,.6);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .tool-card .name { font-size: 16px; font-weight: 600; color: #231e15; }   /* 枕头上背景深暖褐 */
  .tool-card .desc { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  /* 点击波纹效果 */
  .ripple {
    position: absolute; border-radius: 50%; background: rgba(79,124,255,.28);
    transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(2.4); opacity: 0; } }

  /* iframe 容器：top 与顶栏等高（顶栏含状态栏安全区），避免顶栏遮挡工具页顶部 */
  .frame-box { position: fixed; inset: calc(60px + env(safe-area-inset-top)) 0 0 0; background: #fff; display: none; }
  iframe.frame { width: 100%; height: 100%; border: none; display: block; }
  .loading {
    position: absolute; inset: 0; z-index: 1; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: var(--muted); font-size: 15px;
  }
  .loading .spin {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid #e6eaf1; border-top-color: var(--primary);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 工具页打不开时的提示层：说清发生了什么，并给一键修复入口 */
  .frame-err {
    position: absolute; inset: 0; z-index: 6; display: none;
    background: rgba(244,246,251,.97);
    align-items: center; justify-content: center; padding: 24px;
  }
  .frame-err.show { display: flex; }
  .frame-err .fe-box {
    max-width: 460px; background: #fff; border: 1px solid #e6eaf2; border-radius: 14px;
    padding: 24px 26px; text-align: center; box-shadow: 0 12px 34px rgba(31,39,51,.12);
  }
  .frame-err .fe-ico { font-size: 30px; line-height: 1; margin-bottom: 8px; }
  .frame-err h3 { margin: 0 0 8px; font-size: 16px; color: #1f2733; }
  .frame-err p { margin: 0 0 16px; font-size: 13.5px; line-height: 1.75; color: #7c8798; }
  .frame-err .fe-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .frame-err button {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 9px 18px; border-radius: 999px; border: 1px solid #4f7cff;
    background: #4f7cff; color: #fff;
  }
  .frame-err button.ghost { background: #eef3ff; color: #4f7cff; border-color: #d8e3ff; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">🌕Planet 612</span>
    <span class="crumb" id="crumb">首页</span>
    <button class="back" id="back">← 返回首页</button>
  </div>

  <div class="wrap" id="home">
    <div class="home">
      <h1>欢迎使用我的百宝箱</h1>
      <div class="sub">点击下方按钮即可打开对应工具</div>
      <div class="tools" id="tools"><!-- 按钮卡片由 JS 根据 TOOLS 生成 --></div>
      <div style="text-align:center;margin-top:22px">
        <a href="install.html" style="display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:999px;background:#eef3ff;border:1px solid #d8e3ff;color:#4f7cff;text-decoration:none;font-size:13.5px;font-weight:600">📱 装到手机（独立图标 · 全屏 · 离线可用）</a>
      </div>
      <div style="text-align:center;margin-top:14px">
        <button type="button" onclick="p612HardReset(this)" style="border:0;background:none;color:#8a94a6;font-size:12.5px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;padding:4px 8px">⚙ 工具打不开？清除缓存并重载</button>
      </div>
    </div>
  </div>

  <div class="frame-box" id="frameBox">
    <div class="loading" id="loading"><div class="spin"></div>正在打开工具…</div>
    <div class="frame-err" id="frameErr">
      <div class="fe-box">
        <div class="fe-ico">📡</div>
        <h3>这个工具暂时打不开</h3>
        <p id="feMsg">正在重试…</p>
        <div class="fe-btns">
          <button type="button" id="feRetry">再试一次</button>
          <button type="button" class="ghost" onclick="p612HardReset(this)">清除缓存并重载</button>
        </div>
      </div>
    </div>
    <iframe class="frame" id="frame" title="" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>
  </div>

<script>
/* =========================================================
   工具清单：以后要新增嵌套页面，只要在这里加一行即可。
   例： { name: '记账本', file: 'money.html', icon: '💰', desc: '日常记账' }
   对应页面文件放在与本 index.html 同目录即可（同属一个静态站点）。

   hidden: true = 代码与页面都完整保留，只是不在门户显示卡片。
   用于「功能已做好但暂时不想用」的情况：改下面 SHOW_HIDDEN 即可一键放开。
   ========================================================= */
const SHOW_HIDDEN = false;      // ← 以后想放出隐藏工具，把这个改成 true

const TOOLS = [
  { name: '轻身时光簿', file: 'weight.html', icon: '🎯', desc: '记录与查看体重趋势' },
  { name: '刚需日用账', file: 'budget.html', icon: '💰', desc: '追踪每日底线刚需开销' },
  { name: '时光自撰集', file: 'time.html', icon: '⏳', desc: '愿无岁月可回头' },
  { name: '清居置物箱', file: 'storage.html', icon: '🧺', desc: '室内物品整理归纳' },
  { name: '历年收支簿', file: 'ledger.html', icon: '📊', desc: '历年收支导入与分析' },
  { name: '账单透视镜', file: 'analysis.html', icon: '🔍', desc: '钱去哪儿了，哪些能省' },
  { name: '随手记簿', file: 'daily.html', icon: '📝', desc: '日常一笔一笔记', hidden: true },
];

const tools = document.getElementById('tools');
const home = document.getElementById('home');
const frameBox = document.getElementById('frameBox');
const frame = document.getElementById('frame');
const crumb = document.getElementById('crumb');
const back = document.getElementById('back');

/* 资源版本号：以后更新了某个工具页面（如 weight.html），把对应版本号 +1，
   即可强制所有访问者绕过缓存加载新版 */
const TOOLS_VER = { 'time.html': 33, 'weight.html': 38, 'budget.html': 43, 'storage.html': 29, 'ledger.html': 21, 'analysis.html': 24, 'daily.html': 5 };

TOOLS.forEach((t, i) => {
  if (t.hidden && !SHOW_HIDDEN) return;      // 隐藏工具：跳过渲染，索引 i 仍保留在 TOOLS 里
  const c = document.createElement('div');
  c.className = 'tool-card';
  c.innerHTML = `<div class="ico">${t.icon}</div><div class="txt"><div class="name">${t.name}</div><div class="desc">${t.desc || ''}</div></div>`;
  c.onclick = () => openTool(i);
  // 点击波纹效果：在点击位置生成一个扩散渐隐的圆
  c.addEventListener('pointerdown', e => {
    const rect = c.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size / 2) + 'px';
    r.style.top = (e.clientY - rect.top - size / 2) + 'px';
    c.appendChild(r);
    setTimeout(() => r.remove(), 600);
  });
  tools.appendChild(c);
});

let loadPoll = null;   // 加载探测定时器
let healTry = 0;       // 自愈重试次数
let healFile = '';     // 当前正在打开的工具文件
const PORTAL_H1 = '欢迎使用我的百宝箱';

function openTool(i) {
  const t = TOOLS[i];
  healTry = 0;
  healFile = t.file;
  document.getElementById('frameErr').classList.remove('show');
  home.style.display = 'none';
  frameBox.style.display = 'block';
  const ld = document.getElementById('loading');
  ld.style.display = 'flex';                        // 打开时显示加载提示
  const hide = () => { ld.style.display = 'none'; };
  frame.onload = function () { hide(); setTimeout(checkFrame, 120); };
  if (loadPoll) clearInterval(loadPoll);            // 兜底：子页面真正渲染出内容即隐藏（防 iframe 空文档 load 误触发）
  loadPoll = setInterval(() => {
    try {
      const d = frame.contentDocument;
      if (d && d.body && d.body.children.length > 0) { clearInterval(loadPoll); loadPoll = null; hide(); }
    } catch (e) {}
  }, 150);
  // 12 秒兜底：无论 iframe 是否加载成功都撤掉遮罩，避免「一直转圈打不开」
  setTimeout(() => { if (loadPoll) { clearInterval(loadPoll); loadPoll = null; } hide(); }, 12000);
  // ⚠️ 不要再往地址后面加 ?v=NN：
  //   服务器对所有 HTML 都发 Cache-Control: no-store，浏览器本来就不会缓存它，
  //   这个参数对「破缓存」毫无用处；却恰好是旧版 Service Worker 缓存未命中的元凶 ——
  //   旧 SW 的回落是「任何未命中的 URL 都返回门户首页」，于是工具 iframe 里被塞进
  //   门户首页，看起来就是「一点工具就被弹回门户页面」。
  //   不带 query 时，新旧 SW 都能命中缓存里的 ./xxx.html。
  frame.src = t.file;
  frame.title = t.name;
  crumb.innerHTML = `当前：<b>${t.name}</b>`;
  crumb.style.display = 'block';     // 显示当前工具名（顶部右侧指示器）
  back.style.display = 'block';      // 同时显示返回按钮
}

/* ---------------------------------------------------------------
   iframe 自愈：加载完检查工具页的真实内容。
   · 旧版 SW 会把门户首页塞进工具 iframe；
   · 断网时新 SW 会给一张离线提示页；
   两种情况都在这里识别并自动换地址重试 —— 不依赖浏览器里的 SW 是不是最新版，
   也不依赖用户有没有手动清过缓存。
   --------------------------------------------------------------- */
function checkFrame() {
  let d = null;
  try { d = frame.contentDocument; } catch (e) { return; }
  if (!d || !d.body) return;
  const h1 = (d.querySelector('h1') ? d.querySelector('h1').textContent : '').trim();
  const txt = (d.body.innerText || '').trim();
  if (h1.indexOf(PORTAL_H1) >= 0 || txt.indexOf(PORTAL_H1) >= 0) {
    retryFrame('检测到工具页被门户首页占用了（旧缓存的问题），正在重新加载…');
  } else if (txt.indexOf('暂时无法加载这个工具') >= 0) {
    retryFrame('网络没连上，正在重新加载…');
  } else if (d.body.children.length === 0) {
    retryFrame('工具页内容为空，正在重新加载…');
  }
}

function retryFrame(why) {
  if (healTry >= 3) {
    showFrameErr(why.replace(/正在重新加载…$/, '') + '（已重试 ' + healTry + ' 次仍不行）。点「清除缓存并重载」一般能立刻解决。');
    return;
  }
  healTry++;
  showFrameMsg(why);
  const v = TOOLS_VER[healFile];
  // 第 1 次重试用固定的 ?v=NN（新 SW 能正确处理，缓存键稳定）；
  // 之后换随机参数，绕开可能被污染的缓存副本
  frame.src = (healTry === 1)
    ? (v ? healFile + '?v=' + v : healFile)
    : healFile + '?r=' + Date.now() + '_' + healTry;
  setTimeout(() => { if (healTry < 3) checkFrame(); }, 2600);
}

function showFrameMsg(msg) {
  document.getElementById('feMsg').textContent = msg;
  document.getElementById('frameErr').classList.remove('show');
  document.getElementById('loading').style.display = 'flex';
}

function showFrameErr(msg) {
  document.getElementById('feMsg').textContent = msg;
  document.getElementById('frameErr').classList.add('show');
  document.getElementById('loading').style.display = 'none';
}

document.getElementById('feRetry').addEventListener('click', function () {
  healTry = 0;
  document.getElementById('frameErr').classList.remove('show');
  document.getElementById('loading').style.display = 'flex';
  frame.src = healFile + '?r=' + Date.now();
  setTimeout(checkFrame, 2600);
});

back.onclick = () => {
  frameBox.style.display = 'none';
  frame.src = '';
  home.style.display = 'block';
  crumb.textContent = '首页';
  crumb.style.display = 'block';
  back.style.display = 'none';
  healTry = 0;
  document.getElementById('frameErr').classList.remove('show');
};

// Service Worker：iOS 主屏幕模式下联网时永远加载最新版（file:// 环境自动跳过）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  let regRef = null;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    regRef = reg;
    reg.update();                 // 主动查一次更新，别等浏览器自己想起来（PWA 常驻时尤其重要）
  }).catch(() => {});
  // 页面重新可见时再查一次
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && regRef) regRef.update();
  });
  // ⚠️ 这里不要再做「新 SW 接管后 location.reload()」：
  //   自动刷新会把用户从正在看的工具页弹回门户首页（正在填的内容全丢），
  //   而新 SW 自带 skipWaiting + clients.claim()，不刷新也会自动接管。
}

/* 「工具打不开」自助修复：注销 SW + 清掉本族缓存后重载。
   用于旧 SW 一直没换掉、或缓存里存了坏内容的极端情况。 */
window.p612HardReset = async function (btn) {
  try {
    if (btn) { btn.disabled = true; btn.textContent = '正在修复…'; }
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
    const keys = await caches.keys();
    await Promise.all(keys.filter(k => k.indexOf('p612-') === 0).map(k => caches.delete(k)));
  } catch (e) {}
  location.reload();
};
</script>
</body>
</html>
